apiVersion: v1
kind: Namespace
metadata:
  name: scheduler
  labels:
    app: distributed-task-scheduler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: scheduler
data:
  GRPC_PORT: "50051"
  METRICS_PORT: "9090"
  POSTGRES_DSN: "postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  WORKER_CONCURRENCY: "10"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: scheduler-secrets
  namespace: scheduler
type: Opaque
stringData:
  POSTGRES_PASSWORD: "scheduler"
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-server
  namespace: scheduler
  labels:
    app: scheduler-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduler-server
  template:
    metadata:
      labels:
        app: scheduler-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: server
          image: scheduler-server:latest
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: scheduler-config
          env:
            - name: POSTGRES_DSN
              value: "postgres://scheduler:$(POSTGRES_PASSWORD)@postgres:5432/scheduler?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            grpc:
              port: 50051
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-worker
  namespace: scheduler
  labels:
    app: scheduler-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scheduler-worker
  template:
    metadata:
      labels:
        app: scheduler-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: worker
          image: scheduler-worker:latest
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: scheduler-config
          env:
            - name: POSTGRES_DSN
              value: "postgres://scheduler:$(POSTGRES_PASSWORD)@postgres:5432/scheduler?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-server
  namespace: scheduler
  labels:
    app: scheduler-server
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: grpc
      name: grpc
    - port: 9090
      targetPort: metrics
      name: metrics
  selector:
    app: scheduler-server
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-worker
  namespace: scheduler
  labels:
    app: scheduler-worker
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: metrics
      name: metrics
  selector:
    app: scheduler-worker
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: scheduler
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scheduler
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: scheduler
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: scheduler
            - name: POSTGRES_USER
              value: scheduler
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: scheduler
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: scheduler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
